[project]
name = "edsl-bonsai-behavioral-tests"
version = "0.1.0"
description = "Local Bonsai inference with EDSL and an exploratory behavioral evaluation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "edsl @ git+https://github.com/expectedparrot/edsl.git@852a050d0b4e84facdaea0628e7c1e062daa4a46",
  "openai[aiohttp]>=2.44,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]
paper = ["matplotlib>=3.8,<4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
